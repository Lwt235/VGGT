[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vggt-token-space-memory"
version = "0.1.0"
description = "Token-scale Gaussian spatial memory for trainable VGGT reconstruction"
requires-python = ">=3.10"
dependencies = ["torch>=2.6", "numpy>=1.24", "PyYAML>=6", "Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7"]
render = ["gsplat>=1.5,<2"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["gpu: real CUDA rasterization; skipped only when CUDA/gsplat is absent"]
